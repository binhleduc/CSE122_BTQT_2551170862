<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 15 - Máy tính bỏ túi</title>
  <style>
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f4f9;
    }

    /* Vỏ máy tính */
    .calculator {
      width: 340px;
      background-color: #111827;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Màn hình máy tính */
    .screen {
      background-color: #022c22;
      border-radius: 12px;
      padding: 15px 20px;
      text-align: right;
      color: #4ade80;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin-bottom: 20px;
      word-wrap: break-word;
      word-break: break-all;
    }

    /* Phép tính nhỏ ở trên */
    .expression {
      font-size: 18px;
      opacity: 0.85;
      min-height: 24px;
      letter-spacing: 1px;
    }

    /* Kết quả lớn ở dưới */
    .result {
      font-size: 36px;
      font-weight: bold;
      min-height: 44px;
    }

    /* Bàn phím lưới 4 cột */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    /* Thiết lập chung cho nút bấm */
    button {
      height: 55px;
      border: none;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active {
      transform: scale(0.95);
      opacity: 0.8;
    }

    /* Nút số */
    .btn-number {
      background-color: #25313f;
      color: #e5e7eb;
    }

    /* Nút phép tính */
    .btn-operator {
      background-color: #0d6efd;
      color: #ffffff;
    }

    /* Nút C (Xóa) */
    .btn-clear {
      background-color: #dc2626;
      color: #ffffff;
    }

    /* Nút bằng (=) */
    .btn-equal {
      background-color: #16a34a;
      color: #ffffff;
    }

    /* Nút số 0 chiếm 2 cột */
    .btn-zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <!-- Khung vỏ máy tính -->
  <div class="calculator">
    
    <!-- Màn hình hiển thị -->
    <div class="screen">
      <div id="expression" class="expression"></div>
      <div id="result" class="result">0</div>
    </div>

    <!-- Bàn phím lưới 4x5 -->
    <div class="buttons">
      <!-- Hàng 1 -->
      <button class="btn-clear" onclick="clearAll()">C</button>
      <button class="btn-operator" onclick="appendCharacter('(')">(</button>
      <button class="btn-operator" onclick="appendCharacter('%')">%</button>
      <button class="btn-operator" onclick="appendCharacter('÷')">÷</button>

      <!-- Hàng 2 -->
      <button class="btn-number" onclick="appendCharacter('7')">7</button>
      <button class="btn-number" onclick="appendCharacter('8')">8</button>
      <button class="btn-number" onclick="appendCharacter('9')">9</button>
      <button class="btn-operator" onclick="appendCharacter('×')">×</button>

      <!-- Hàng 3 -->
      <button class="btn-number" onclick="appendCharacter('4')">4</button>
      <button class="btn-number" onclick="appendCharacter('5')">5</button>
      <button class="btn-number" onclick="appendCharacter('6')">6</button>
      <button class="btn-operator" onclick="appendCharacter('-')">-</button>

      <!-- Hàng 4 -->
      <button class="btn-number" onclick="appendCharacter('1')">1</button>
      <button class="btn-number" onclick="appendCharacter('2')">2</button>
      <button class="btn-number" onclick="appendCharacter('3')">3</button>
      <button class="btn-operator" onclick="appendCharacter('+')">+</button>

      <!-- Hàng 5 -->
      <button class="btn-number btn-zero" onclick="appendCharacter('0')">0</button>
      <button class="btn-number" onclick="appendCharacter('.')">.</button>
      <button class="btn-equal" onclick="calculate()">=</button>
    </div>

  </div>

  <script>
    let currentInput = ""; // Lưu chuỗi phép tính người dùng nhập

    const expressionEl = document.getElementById("expression");
    const resultEl = document.getElementById("result");

    // Hàm thêm ký tự (số/phép tính) vào màn hình
    function appendCharacter(char) {
      currentInput += char;
      expressionEl.innerText = currentInput;
    }

    // Hàm xóa toàn bộ (Nút C)
    function clearAll() {
      currentInput = "";
      expressionEl.innerText = "";
      resultEl.innerText = "0";
    }

    // Hàm tính toán kết quả (Nút =)
    function calculate() {
      if (!currentInput) return;

      try {
        // Thay thế các ký tự hiển thị thành toán tử JavaScript hợp lệ
        let formattedInput = currentInput
          .replace(/×/g, "*")
          .replace(/÷/g, "/");

        // Tính toán kết quả sử dụng hàm Function (thay cho eval)
        let evalResult = new Function('return ' + formattedInput)();

        // Hiển thị kết quả lên màn hình
        resultEl.innerText = evalResult;
      } catch (error) {
        resultEl.innerText = "Lỗi";
      }
    }
  </script>

</body>
</html>
