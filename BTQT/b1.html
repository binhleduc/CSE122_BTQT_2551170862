<!DOCTYPE html>
<html lang="vi">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <style>
        .khung{
            background-color: #FFFDE7;
            border: 1px solid#9E9E9E;
            margin: 20px;
            max-width: 600px;
            padding: 20px;
            text-align: center;

        }
        .tieude{
            color:  #D40000;
            background-color: #FFD9E6;
            font-weight: bold;

        }
        .kho-tho{
            font-weight: bold;
            font-style: italic;


        }
        .xanh {
            color:  #0033CC;
        }
        .do {
            color: #D40000;
        }
        hr{
           width: 55%; 
           border-top: 1px solid #0033CC;
           margin: 20px auto;
        }
      </style>
    </head>
    <body>
    <div class="khung">
        <h1 class="tieude">BỐN MÙA</h1>
        <p class="kho-tho xanh">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm
        </p>
        <hr>
        <p class="kho-tho do">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai
        </p>
        <hr>
        <p class="kho-tho xanh">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường
        </p>
    </div>
    </body>
</html>
