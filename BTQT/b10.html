<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên hệ với chúng tôi - Bài 10</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body{
      background-color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .contact-form {
      background-color: #f9f9f9;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 100%;
      overflow: hidden;
    }
    .form-header {
      background-color:#0f766e ;
      color: white;
      padding: 25px 35px;
    
    }
    .form-header h1 {
      margin-bottom: 8px;
      font-size: 24px;
    }
    .form-header p {
      font-size: 14px;
      opacity: 0.9;
    }
    .form-body {
      padding: 30px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    .form-group.full-width {
      grid-column: span 2;
    }
    .label {
      color: #334155;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 8px;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select,
    textarea{
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1 ;
      border-radius: 6px;
      color: black;
      outline: none;
      background-color: #FFFFFF;
      font-size: 14px;

    }
    input:focus, select:focus, textarea:focus{
      border-color: #0f766e;
    }
    textarea {
      resize: vertical;
    }
    .checkbox-group{
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 25px;
    }
    .checkbox-group input[type="checkbox"]{
      width: 16px;
      height: 16px;
      accent-color: #007 ;
      cursor: pointer;
    }
    .checkbox-group label{
      font-weight: normal;
      font-size: 14px;
      color: #334155;
      margin-bottom: 0;
      cursor: pointer;
    }
    .button-group{
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-submit{
      background-color: #0f766e;
      color: #FFFFFF;

    }
    .btn-reset {
      background-color:#e2e8f0 ;
      color: black;
    }
  </style>
</head>
<body>

  <!-- Thẻ form chính -->
  <form class="contact-form" action="#" method="POST">
    
    <!-- Tiêu đề màu xanh phía trên form -->
    <div class="form-header">
      <h1>Liên hệ với chúng tôi</h1>
      <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
    </div>

    <!-- Phần chứa các ô nhập dữ liệu -->
    <div class="form-body">
      
      <!-- Lưới 2 cột chứa các ô nhập ngắn -->
      <div class="form-grid">
        
        <!-- Họ và tên -->
        <div class="form-group">
          <label for="fullname">Họ và tên</label>
          <input type="text" id="fullname" name="fullname" value="Nguyễn Văn An" required>
        </div>

        <!--  Email -->
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="an.nv@tlu.edu.vn" required>
        </div>

        <!-- Số điện thoại -->
        <div class="form-group">
          <label for="phone">Số điện thoại</label>
          <input type="tel" id="phone" name="phone" value="0987 654 321">
        </div>

        <!-- Chọn chủ đề (dạng danh sách sổ xuống select) -->
        <div class="form-group">
          <label for="topic">Chủ đề</label>
          <select id="topic" name="topic">
            <option value="course" selected>Hỏi về khoá học</option>
            <option value="support">Hỗ trợ kỹ thuật</option>
            <option value="other">Chủ đề khác</option>
          </select>
        </div>

        <!-- Nội dung (chiếm trọn 2 cột) -->
        <div class="form-group full-width">
          <label for="message">Nội dung</label>
          <textarea id="message" name="message" rows="4">Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ.</textarea>
        </div>

      </div>

      <!-- tích chọn đồng ý -->
      <div class="checkbox-group">
        <input type="checkbox" id="agree" name="agree" checked>
        <label for="agree">Tôi đồng ý nhận email phản hồi.</label>
      </div>

      <!-- nút chức năng -->
      <div class="button-group">
        <button type="submit" class="btn btn-submit">Gửi liên hệ</button>
        <button type="reset" class="btn btn-reset">Nhập lại</button>
      </div>

    </div>

  </form>

</body>
</html>
