<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Các món ngon Hà Nội</title>
  
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #FFF9E8;
            margin: 50px auto;
        }
        h1{
            text-align: center;
            color:  #E65100;
        }
        .container{
            display: flex;
            align-items: flex-start;
            width: 900px;
            margin: 20px auto;
        }
        .anh {
            width: 230px;
            border-radius: 10px;
        }
        .bang {
            width:600px;
        }
        table{
            width: 100%;
            border-collapse: collapse;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        th{
            background-color: #E65100;
            color: white;
            padding: 10px;
            border-bottom: 1px solid  #E0D6C2;
        }
        td{
            padding: 10px;
            border: 1px solid  #E0D6C2;
            background-color: #FFFF;
        }
        tr:nth-child(even) td{
            background-color: #FDF8EF;
        }
        th:first-child, td:first-child{
            width: 80px;
            text-align: center;
        }
        th:last-child, td:last-child{
            text-align: left;
        }
    </style>
</head>


<body>

    <h1>Các món ngon Hà Nội</h1>

    <div class="container">

        <div class="anh">
            <img src ="bai6.gif" alt="Minh họa món ăn">
        </div>

        <div class="bang">
            <table>
                <tr>
                    <th>STT</th>
                    <th>Tên món ăn</th>
                </tr>

                <tr>
                    <td>1</td>
                    <td>Bánh cuốn Thanh Trì</td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>Xôi Hà Nội</td>
                </tr>

                <tr>
                    <td>3</td>
                    <td>Chả cá Lã Vọng</td>
                </tr>

                <tr>
                    <td>4</td>
                    <td>Cháo Cóc</td>
                </tr>

                <tr>
                    <td>5</td>
                    <td>Bánh Gai Ninh Giang</td>
                </tr>

                <tr>
                    <td>6</td>
                    <td>Bún Thang Hà Nội</td>
                </tr>

                <tr>
                    <td>7</td>
                    <td>Canh Láng</td>
                </tr>

                <tr>
                    <td>8</td>
                    <td>Vịt quay Lạng Sơn</td>
                </tr>
            </table>
        </div>

    </div>

</body>
</html>
