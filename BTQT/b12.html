<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Lịch</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('anhb12.gif'); 
            background-repeat: repeat;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Khung bao ngoài */
        .card-container {
            background-color: #ffffff;
            width: 420px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }

        /* Ô tờ lịch hiển thị kết quả */
        .calendar-box {
            border: 1px solid #ccc;
            background-color: #FFFFFF;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Năm và số ngày có màu đỏ #C62828 */
        .year-text {
            color: #C62828;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* Tháng và thứ có màu xanh #1565C0 */
        .month-text {
            color: #1565C0;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* Số ngày rất lớn 52px */
        .day-number {
            color: #C62828;
            font-size: 52px;
            font-weight: bold;
            line-height: 1;
            margin: 15px 0;
        }

        .weekday-text {
            color: #1565C0;
            font-size: 18px;
            font-weight: bold;
        }

        /* Lời chào theo buổi màu đỏ, in nghiêng */
        .greeting-text {
            color: #C62828;
            font-size: 20px;
            font-style: italic;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Form nhập liệu viền xanh #1565C0 */
        .input-form {
            border: 2px solid #1565C0;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-group label {
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .input-group input {
            width: 55px;
            padding: 6px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        /* Nút In lịch */
        .btn-print {
            background-color: #546e7a;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            line-height: 1.3;
            height: 48px;
            align-self: flex-end;
            transition: background-color 0.2s;
        }

        .btn-print:hover {
            background-color: #455a64;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Ô hiển thị tờ lịch -->
        <div class="calendar-box">
            <div class="year-text" id="displayYear">2026</div>
            <div class="month-text" id="displayMonth">Tháng 12</div>
            <div class="day-number" id="displayDay">24</div>
            <div class="weekday-text" id="displayWeekday">Thứ hai</div>
        </div>

        <!-- Lời chào theo buổi -->
        <div class="greeting-text" id="displayGreeting">Chào buổi sáng!</div>

        <!-- Form nhập liệu 3 ô + 1 nút -->
        <div class="input-form">
            <div class="input-group">
                <label for="inputDay">Ngày</label>
                <input type="number" id="inputDay" value="24" min="1" max="31">
            </div>

            <div class="input-group">
                <label for="inputMonth">Tháng</label>
                <input type="number" id="inputMonth" value="12" min="1" max="12">
            </div>

            <div class="input-group">
                <label for="inputYear">Năm</label>
                <input type="number" id="inputYear" value="2026" min="1">
            </div>

            <button type="button" class="btn-print" id="btnPrint">In<br>lịch</button>
        </div>
    </div>

    <script>
        // Mảng hiển thị tên các thứ trong tuần
        const weekdays = ["Chủ nhật", "Thứ hai", "Thứ ba", "Thứ tư", "Thứ năm", "Thứ sáu", "Thứ bảy"];

        // Hàm lấy lời chào theo giờ hiện tại
        function getGreeting() {
            const hours = new Date().getHours();
            if (hours >= 5 && hours < 12) {
                return "Chào buổi sáng!";
            } else if (hours >= 12 && hours < 18) {
                return "Chào buổi chiều!";
            } else {
                return "Chào buổi tối!";
            }
        }

        // Hàm xử lý khi bấm nút "In lịch"
        function renderCalendar() {
            const dayVal = parseInt(document.getElementById('inputDay').value);
            const monthVal = parseInt(document.getElementById('inputMonth').value);
            const yearVal = parseInt(document.getElementById('inputYear').value);

            if (isNaN(dayVal) || isNaN(monthVal) || isNaN(yearVal)) {
                alert("Vui lòng nhập đầy đủ ngày, tháng, năm hợp lệ!");
                return;
            }

            // Tạo đối tượng Date (Lưu ý: Tháng trong JS tính từ 0 đến 11)
            const targetDate = new Date(yearVal, monthVal - 1, dayVal);

            // Kiểm tra tính hợp lệ của ngày tháng nhập vào
            if (targetDate.getFullYear() !== yearVal || 
                targetDate.getMonth() !== monthVal - 1 || 
                targetDate.getDate() !== dayVal) {
                alert("Ngày tháng năm nhập vào không tồn tại!");
                return;
            }

            // Lấy thứ dựa trên getDay()
            const weekdayName = weekdays[targetDate.getDay()];

            // Cập nhật giao diện tờ lịch
            document.getElementById('displayYear').textContent = yearVal;
            document.getElementById('displayMonth').textContent = `Tháng ${monthVal}`;
            document.getElementById('displayDay').textContent = dayVal;
            document.getElementById('displayWeekday').textContent = weekdayName;
            document.getElementById('displayGreeting').textContent = getGreeting();
        }

        // Gọi hàm bằng addEventListener khi bấm nút theo gợi ý
        document.getElementById('btnPrint').addEventListener('click', renderCalendar);

        // Khởi chạy cập nhật lời chào ban đầu
        document.getElementById('displayGreeting').textContent = getGreeting();
    </script>

</body>
</html>
